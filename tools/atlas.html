<!doctype html><meta charset="utf-8"><title>Атлас персонажей</title>
<!--
  Лист всех внешностей во всех позах. Фигуры собираются кодом, и правку
  в причёске или в осанке иначе видно только в игре, куда до нужного
  прохожего ещё надо дойти.

  Открывается на dev-сервере: /tools/atlas.html. В сборку не попадает —
  входная точка у неё одна, index.html.
-->
<style>body{margin:0;background:#5a6a7a}canvas{image-rendering:auto}</style>
<canvas id="c"></canvas>
<script type="module">
import { ACTOR_SPRITE, POSES } from '/src/game/art/figure/pose.ts';
import { POSE } from '/src/game/art/figure/pose.ts';
import { paintFigure } from '/src/game/art/figure/paint.ts';
import { EXTRA } from '/src/game/art/figure/extra.ts';
import { LOOKS } from '/src/game/art/looks.ts';

const Z = Number(new URLSearchParams(location.search).get('zoom') ?? 3);
const W = ACTOR_SPRITE.width, H = ACTOR_SPRITE.height, PAD = 4;
const c = document.getElementById('c');
c.width = (W + PAD) * POSES.length * Z;
c.height = (H + PAD) * LOOKS.length * Z;
const g = c.getContext('2d');

LOOKS.forEach((look, i) => {
  const figure = { colors: look.colors, hair: look.hair, outfit: look.outfit, accessory: look.accessory };
  POSES.forEach((pose, p) => {
    const joints = POSE[pose];
    g.save();
    g.translate((W + PAD) * p * Z, (H + PAD) * i * Z);
    const brush = { ctx: g, scale: Z };
    paintFigure(brush, figure, joints);
    EXTRA[figure.accessory]?.(brush, figure, joints, joints.lift);
    g.restore();
  });
});
document.title = 'atlas ' + LOOKS.length;
</script>
