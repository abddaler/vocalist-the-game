<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Vocalist Sim</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #08090c;
      }

      /* Поля вокруг игры — не пустота, а рамка: тёплый свет сцены из-за кулис. */
      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 45%, #1b1d26 0%, #0b0c11 55%, #07080b 100%);
      }

      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 2px;
        box-shadow:
          0 0 0 1px #2a2e3a,
          0 0 34px -6px rgba(143, 191, 127, 0.18),
          0 18px 48px -12px rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
