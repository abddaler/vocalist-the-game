<!doctype html>
<html lang="ru">
  <head>
    <!--
      Спасение от протухшей страницы.

      Имя собранного файла игры содержит хэш и меняется с каждым
      обновлением, а index.html телефон охотно держит в кэше. Тогда
      страница просит файл, которого на сервере уже нет: модуль не
      загружается, и вместе с ним не загружается всё, что умеет
      сообщать об ошибках, — человек видит чёрный экран и ничего больше.
      Именно это и значит «после каждого обновления на телефоне не
      работает».

      Сторож живёт прямо в странице, обычным скриптом: он переживает
      падение модуля. И стоит он ПЕРВЫМ в head — сборщик подставляет
      тег игры в конец head, и слушатель, объявленный после него, может
      не успеть к ошибке загрузки.

      Отметка о попытке живёт со сроком, а не до конца вкладки. Раньше
      одна разовая осечка помечала вкладку навсегда: следующая попытка,
      даже через сутки, уже не перезагружалась, а сразу показывала
      надпись. Телефон с полусотней вкладок из этого не выбирался.
    -->
    <script>
      (function () {
        var KEY = 'vocalist-sim/recovered';
        // Сколько отметка о попытке считается свежей, мс. Две минуты:
        // за это время осечка либо повторится, либо была разовой.
        var HOLD = 120000;
        var loaded = false;
        var failed = '';

        function recent() {
          try {
            var at = Number(sessionStorage.getItem(KEY));
            return at > 0 && Date.now() - at < HOLD;
          } catch (error) {
            return false;
          }
        }

        function remember() {
          try {
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (error) {
            /* приватный режим: попробуем перезагрузиться ещё раз */
          }
        }

        function forget() {
          try {
            sessionStorage.removeItem(KEY);
          } catch (error) {
            /* пусто */
          }
        }

        /*
         * Причина словами. «Не удалось загрузить игру» не говорит ничего
         * ни игроку, ни тому, кто чинит: сеть, кэш и сломанный файл
         * выглядят одинаково. Пусть скажет, что именно не загрузилось и
         * была ли связь.
         */
        function say(reason) {
          var box = document.getElementById('boot');
          if (!box) return;
          var lines = ['Игра не запустилась.', reason];
          if (failed) lines.push('Файл: ' + failed);
          lines.push('Сеть: ' + (navigator.onLine ? 'есть' : 'нет'));
          box.textContent = lines.join('\n');
          var again = document.createElement('button');
          again.id = 'retry';
          again.textContent = 'Попробовать снова';
          again.onclick = function () {
            forget();
            location.replace(location.pathname + '?r=' + Date.now());
          };
          box.appendChild(again);
          document.body.className += ' boot-failed';
        }

        function recover(reason) {
          if (window.__vsReady) return;
          if (recent()) return say(reason);
          remember();
          // Новый параметр в адресе — новый ключ кэша: страницу придётся
          // взять из сети, а с ней придёт и верное имя файла игры.
          location.replace(location.pathname + '?r=' + Date.now());
        }

        window.__vsReady = false;
        window.__vsBooted = function () {
          window.__vsReady = true;
          forget();
        };

        // Ошибки загрузки ресурсов не всплывают, но проходят фазу
        // погружения, поэтому слушаем с capture.
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!target || target.tagName !== 'SCRIPT') return;
            failed = String(target.src || '').split('/').pop();
            recover('Не удалось загрузить игру.');
          },
          true,
        );
        window.addEventListener(
          'load',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') loaded = true;
          },
          true,
        );

        // Запасной срок — на случай, когда файл отдался, но пустым или
        // обрезанным. Он длинный: на медленном телефоне разбор игры сам
        // по себе не быстрый, и торопить его перезагрузкой нельзя.
        window.setTimeout(function () {
          if (!window.__vsReady && !loaded) recover('Игра не загрузилась за 20 секунд.');
        }, 20000);
      })();
    </script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:," />
    <title>Vocalist Sim</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* dvh учитывает исчезающие панели мобильных браузеров; для тех,
           кто его не знает, выше остаётся 100%. */
        height: 100dvh;
        overflow: hidden;
        background: #08090c;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      body {
        /* Игра управляется тапами: двойной тап не должен зумить страницу,
           а долгое нажатие — выделять текст и подсвечивать элементы. */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Поля вокруг игры — не пустота, а рамка: тёплый свет сцены из-за кулис. */
      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 45%, #1b1d26 0%, #0b0c11 55%, #07080b 100%);
      }

      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 2px;
        box-shadow:
          0 0 0 1px #2a2e3a,
          0 0 34px -6px rgba(143, 191, 127, 0.18),
          0 18px 48px -12px rgba(0, 0, 0, 0.9);
      }

      /*
       * Узкий портрет: 16:9 в такую ширину помещается мелко, но играть
       * можно. Раньше игра здесь пряталась целиком под просьбой повернуть
       * телефон — а с блокировкой поворота это тупик, из которого не
       * выйти. Теперь это подсказка снизу, которая гаснет сама.
       */
      #rotate {
        position: fixed;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: none;
        max-width: 90vw;
        padding: 8px 14px;
        border: 1px solid #5c3f9c;
        border-radius: 999px;
        text-align: center;
        font: 13px/1.3 system-ui, sans-serif;
        color: #2ee6c8;
        background: rgba(26, 16, 48, 0.92);
        z-index: 10;
        transition: opacity 0.4s;
      }

      body.portrait-hint #rotate {
        display: block;
      }
      body.hint-fading #rotate {
        opacity: 0;
      }

      /*
       * Если игра не завелась, чёрный экран не объясняет ничего ни
       * игроку, ни тому, кто будет чинить. Пусть скажет, что случилось.
       */
      #boot {
        position: fixed;
        inset: 0;
        display: none;
        place-content: center;
        padding: 24px;
        text-align: center;
        font: 14px/1.6 ui-monospace, monospace;
        color: #ff9a9a;
        background: #1a1030;
        z-index: 20;
        white-space: pre-wrap;
        word-break: break-word;
      }

      body.boot-failed #boot {
        display: grid;
      }

      #retry {
        margin: 18px auto 0;
        padding: 10px 18px;
        border: 1px solid #5c3f9c;
        border-radius: 999px;
        font: 14px/1 ui-monospace, monospace;
        color: #2ee6c8;
        background: #2b1c4e;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"></div>
    <div id="boot"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
